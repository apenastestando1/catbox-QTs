<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria QT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-weight: 500;
      font-size: 1.4rem;
      opacity: .8;
    }
    #status {
      text-align: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
      opacity: 0.6;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .gallery img {
      height: 180px;
      width: auto;
      object-fit: cover;
      cursor: pointer;
      border-radius: 6px;
      transition: transform .15s, box-shadow .15s;
      background: #222;
    }
    .gallery img:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
    }
    #fullscreen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      cursor: zoom-out;
    }
    #fullscreen img {
      max-width: 96vw;
      max-height: calc(96vh - 60px);
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(0,0,0,.6);
    }
    #downloadBtn {
      padding: 10px 24px;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    #downloadBtn:hover {
      background: #e0e0e0;
      transform: scale(1.05);
    }
    #closeBtn {
      position: absolute;
      top: 16px;
      right: 20px;
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,.15);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.6rem;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, transform .15s;
      line-height: 1;
    }
    #closeBtn:hover {
      background: rgba(255,255,255,.3);
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1>Galeria</h1>
  <div id="status">Carregando imagens...</div>
  <div class="gallery" id="gallery"></div>

  <div id="fullscreen" onclick="closeFull()">
    <button id="closeBtn" onclick="closeFull()" title="Fechar">×</button>

    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const base = 'https://catbox.moe/pictures/qts/';
    let loaded = 0;
    let currentSrc = '';

    function loadNext(i) {
      if (i >= files.length) {
        status.textContent = `Carregadas ${loaded} de ${files.length} imagens`;
        return;
      }

      const img = document.createElement('img');
      img.alt = '';
      img.onclick = () => openFull(img);

      img.onload = () => {
        loaded++;
        status.textContent = `Carregando... ${loaded}/${files.length}`;
        setTimeout(() => loadNext(i + 1), 500);
      };

      img.onerror = () => {
        status.textContent = `Erro em ${files[i]}... ${loaded}/${files.length}`;
        setTimeout(() => loadNext(i + 1), 500);
      };

      img.src = base + files[i];
      gallery.appendChild(img);
    }

    loadNext(0);

    function openFull(img) {
      const modal = document.getElementById('fullscreen');
      const fullImg = document.getElementById('fullImg');
      fullImg.src = img.src;
      currentSrc = img.src;
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeFull() {
      document.getElementById('fullscreen').style.display = 'none';
      document.body.style.overflow = '';
    }

    function downloadImage(e) {
      e.stopPropagation();
      if (!currentSrc) return;

      const a = document.createElement('a');
      a.href = currentSrc;
      a.download = currentSrc.split('/').pop() || 'imagem.png';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeFull();
    });
